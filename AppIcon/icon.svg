<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CF0"/>
      <stop offset="1" stop-color="#3E8FE0"/>
    </linearGradient>
  </defs>

  <!-- squircle background, padded to match macOS large-rounded-square icon template -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>

  <!-- waveform bars flanking the mic -->
  <rect x="252" y="452" width="34" height="120" rx="17" fill="#FFFFFF" opacity="0.55"/>
  <rect x="204" y="392" width="34" height="240" rx="17" fill="#FFFFFF" opacity="0.4"/>
  <rect x="738" y="452" width="34" height="120" rx="17" fill="#FFFFFF" opacity="0.55"/>
  <rect x="786" y="392" width="34" height="240" rx="17" fill="#FFFFFF" opacity="0.4"/>

  <!-- mic body -->
  <rect x="452" y="256" width="120" height="300" rx="60" ry="60" fill="#FFFFFF"/>

  <!-- mic stand cradle -->
  <path d="M400 500 a112 112 0 0 0 224 0" stroke="#FFFFFF" stroke-width="36" fill="none" stroke-linecap="round"/>

  <!-- mic stand post + base -->
  <line x1="512" y1="612" x2="512" y2="676" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <line x1="424" y1="676" x2="600" y2="676" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
</svg>
